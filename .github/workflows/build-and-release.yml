name: Build & Release Installers

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release packages to GitHub Releases'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release' }}

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || jq -r .version package.json)
            TAG_NAME="v${VERSION}"
          fi
          echo "Ensuring release exists for tag: $TAG_NAME"
          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" --target "${{ github.sha }}" --title "$TAG_NAME" --generate-notes || true

  build-and-publish:
    name: Build & Package (${{ matrix.os }})
    needs: [prepare-release]
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build installable packages (Pull Requests)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run make

      - name: Build and publish release packages to GitHub Releases
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bunsenworship-${{ matrix.os }}
          path: dist-release/**/*
          if-no-files-found: warn
