name: Build & Release Installers

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release packages to GitHub Releases'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release' }}

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build installable packages (Non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release' && inputs.publish != true }}
        run: npm run make

      - name: Build and publish release packages (Release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.publish == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bunsenworship-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: warn
